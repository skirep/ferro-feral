let audio, music, fx, step=0, nextBeat=0, muted=false;
function level(index){

 });

 shots=[];heat=flash=hurt=0;
 const [ex,ey]=rooms[chapter.route.at(-1)];

 for(const [order,kind] of [[2,'ammo'],[4,'hp'],[6,'ammo'],[8,'hp'],[10,'ammo'],[12,'hp'],[14,'ammo']]){

 }
 if(n===0)owned.clear();

 arrivals.forEach((id,i)=>{

 });

const wall=(x,y)=>grid[Math.floor(y)]?.[Math.floor(x)]!==0;
const floor=(x,y)=>heights[Math.floor(y)]?.[Math.floor(x)]??0;
const angle=a=>Math.atan2(Math.sin(a),Math.cos(a));
function move(o,x,y,r){

 if(!wall(o.x+r,o.y+y+r)&&!wall(o.x-r,o.y+y+r)&&!wall(o.x+r,o.y+y-r)&&!wall(o.x-r,o.y+y-r))o.y+=y;
}
function ray(x,y,dx,dy,startZ,endZ,distance){

 for(let i=0;i<mapSize*2;i++){
  const side=ty<tx,d=side?ty:tx;
  if(side){iy+=sy;ty+=ay}else{ix+=sx;tx+=ax}
  if(d>=distance)return true;
  const rayZ=startZ+(endZ-startZ)*d/distance;
  if(grid[iy]?.[ix]!==0||rayZ<=heights[iy][ix])return false;
 }

}
const portraits=new Image(),turnarounds=new Image();
const atlas=new Map();
const floating=new Set([3,6,9]);
const jumpDuration=.76;
function facingView(facing,bearing){
 return (Math.round(angle(bearing-facing)*4/Math.PI)+8)%8;
}
function hopHeight(e){

}
function sprite(id,pose,frame,view){

 if(atlas.has(key))return atlas.get(key);

 const c=document.createElement('canvas');c.width=c.height=128;
 const g=c.getContext('2d');g.imageSmoothingEnabled=false;

 const shot=pose==='shoot',firing=shot&&frame>=6&&frame<=8;
 const die=pose==='death',hit=pose==='hit';
 const swing=Math.sin(cycle),lift=Math.sin(t*Math.PI);
 const recoil=firing?1-(frame-6)*.23:0;
 const side=view===0||view===4?0:view<4?1:-1;
 const directional=Math.min(view,8-view);
 const original=view===0&&(step||shot||pose==='idle'||hit||die||jump);
 const poseRow=step?(frame%6<2?0:frame<6?1:2):shot&&frame>=4&&frame<=9?3:0;
 const sx=id%5*112,sy=original?(Math.floor(id/5)+poseRow*2)*112:(Math.floor(id/5)*5+directional)*112;
 const art=original?portraits:turnarounds;
 const bob=step?-Math.abs(swing)*(run?7:4):floating.has(id)?swing*2:0;
 g.translate(64-side*recoil*6,119+bob);
 if(die){g.translate(8*t,0);g.rotate(t*.49)}
 if(hit){g.translate((side||1)*5*(1-t),0);g.rotate((side||1)*.15*(1-t))}
 if(view>=5)g.scale(-1,1);
 g.scale(1+(jump?.13*lift:0),die?1-.81*t:jump?1-.20*lift:1+recoil*.08);
 const stride=step?swing*(run?15:8):0;
 const lean=step&&run&&side?6:shot?5-recoil*10:0;
 for(let row=0;row<112;row++){
  const body=Math.min(1,(112-row)/62);
  const knee=Math.max(0,(row-63)/49);
  const x=-56+Math.round(lean*body);
  if((step||jump)&&row>=60&&!floating.has(id)){
   const movement=jump?lift*6:stride;
   g.drawImage(art,sx,sy+row,56,1,x+Math.round(movement*knee),row-112,56,1);
   g.drawImage(art,sx+56,sy+row,56,1,x+56-Math.round(movement*knee),row-112,56,1);
  }else{
   g.drawImage(art,sx,sy+row,112,1,x,row-112,112,1);
  }
 }
 if(firing&&view!==4){
  const muzzle=side?39:12, y=id===0||id===5||id===7?-43:-67;
  g.fillStyle=types[id][1];g.fillRect(muzzle-7,y-2,14,5);
  g.fillRect(muzzle-2,y-7,5,15);
  g.fillStyle='#fff9ca';g.fillRect(muzzle-2,y-2,6,5);

}
let enemiesReady=false;
function prepareEnemies(){
 const button=$('start'),label=button.textContent;
 button.disabled=true;button.textContent='Preparant els enemics…';
 let remaining=2;
 const ready=()=>{if(--remaining===0){enemiesReady=true;button.disabled=false;button.textContent=label}};
 const failed=()=>{
  button.textContent='Recarrega per tornar-ho a provar';
  button.disabled=false;button.onclick=()=>location.reload();
 };
 portraits.onload=turnarounds.onload=ready;
 portraits.onerror=turnarounds.onerror=failed;

}
function initAudio(){
 if(!audio){
  audio=new AudioContext();music=audio.createGain();fx=audio.createGain();
  music.gain.value=muted?0:.34;fx.gain.value=.28;music.connect(audio.destination);fx.connect(audio.destination);
 }
 audio.resume(); nextBeat=audio.currentTime;
}
function tone(freq,duration,volume,wave,when,out,end=freq){
 const o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();
 filter.type='lowpass';filter.frequency.value=wave==='sawtooth'?1200:2300;
 o.type=wave;o.frequency.setValueAtTime(freq,when);o.frequency.exponentialRampToValueAtTime(end,when+duration);
 g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(volume,when+.009);g.gain.exponentialRampToValueAtTime(.0001,when+duration);
 o.connect(filter);filter.connect(g);g.connect(out);o.start(when);o.stop(when+duration+.01);
}
const riffs=[
 [0,0,3,0,6,0,5,3,0,0,10,0,6,5,3,1],
 [0,7,0,1,0,8,5,3,0,0,7,10,3,1,6,5],
 [0,0,0,6,1,0,8,6,0,12,0,7,6,3,1,0]
];
function score(){
 if(!audio)return;

 while(nextBeat<audio.currentTime+.12){
  const i=step%16, root=[41.2,46.25,36.71][n], pitch=root*2**(riffs[n][i]/12);
  tone(pitch,.14,.25,'triangle',nextBeat,music);
  if(i!==7&&i!==15){
   tone(pitch*2,.115,.10,'sawtooth',nextBeat,music);
   tone(pitch*3,.115,.06,'sawtooth',nextBeat,music);
  }
  if(i%4===0||i===11)tone(105,.15,.5,'sine',nextBeat,music,36);
  if(i%8===4)tone(193,.095,.22,'square',nextBeat,music,58);
  if(i%2===0)tone(713,.026,.055,'square',nextBeat,music,269);
  if(i===0||i===10)tone(pitch*8,.35,.055,'triangle',nextBeat,music);
  nextBeat+=60/[128,144,156][n]/4;step++;
 }
}
function fire(){
 if(heat>0)return;

 if(p.ammo<gun.cost){weapon=0;gun=guns[0]}
 p.ammo-=gun.cost;heat=gun.rate;flash=.105;
 if(audio)tone(gun.sound,weapon===1?.24:.16,.7,'sawtooth',audio.currentTime,fx,29);
 const targets=foes.filter(e=>{
  const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||.001;
  return e.hp>0&&d<gun.range&&Math.abs(angle(Math.atan2(dy,dx)-p.a))<Math.atan2(.30,d)+gun.spread&&ray(p.x,p.y,dx/d,dy/d,p.z+.5,floor(e.x,e.y)+.52+hopHeight(e),d);
 }).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
 targets.slice(0,gun.targets).forEach((e,i)=>{
  const distance=Math.hypot(e.x-p.x,e.y-p.y);
  const drop=weapon===1?Math.max(.30,1-distance*.13):1;
  e.hp-=gun.damage*drop/(1+i*.42)*(e.id===8&&!e.wind?.55:1);
  e.hit=.17;
  if(weapon===4){
   for(const other of foes){
    const dx=other.x-e.x,dy=other.y-e.y,d=Math.hypot(dx,dy);
    if(other===e||other.hp<=0||d>1.5||!ray(e.x,e.y,dx/d,dy/d,floor(e.x,e.y)+.52,floor(other.x,other.y)+.52,d))continue;
    other.hp-=44*(1-d/1.6);other.hit=.17;
   }
  }
 });
}
function damage(v){if(hurt<=0){p.hp=Math.max(0,p.hp-v);hurt=.32}}
const neighbors=[[1,0],[-1,0],[0,1],[0,-1]];
function updateNavigation(){

 for(let i=0;i<queue.length;i++){
  const node=queue[i],x=node%mapSize,y=Math.floor(node/mapSize);
  for(const [dx,dy] of neighbors){
   const nx=x+dx,ny=y+dy,next=ny*mapSize+nx;
   if(grid[ny]?.[nx]!==0||values[next]!==-1)continue;
   values[next]=values[node]+1;queue.push(next);
  }
 }

}
function update(dt){

   }
