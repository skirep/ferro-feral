const wall=(x,y)=>grid[Math.floor(y)]?.[Math.floor(x)]!==0;
const floor=(x,y)=>heights[Math.floor(y)]?.[Math.floor(x)]??0;
const angle=a=>Math.atan2(Math.sin(a),Math.cos(a));
function move(o,x,y,r){
 if(!wall(o.x+x+r,o.y+r)&&!wall(o.x+x-r,o.y+r)&&!wall(o.x+x+r,o.y-r)&&!wall(o.x+x-r,o.y-r))o.x+=x;
 if(!wall(o.x+r,o.y+y+r)&&!wall(o.x-r,o.y+y+r)&&!wall(o.x+r,o.y+y-r)&&!wall(o.x-r,o.y+y-r))o.y+=y;
}
function ray(x,y,dx,dy,startZ,endZ,distance){
 let ix=Math.floor(x),iy=Math.floor(y);
 const sx=Math.sign(dx),sy=Math.sign(dy),ax=Math.abs(1/dx),ay=Math.abs(1/dy);
 let tx=sx===0?Infinity:(dx<0?x-ix:ix+1-x)*ax;
 let ty=sy===0?Infinity:(dy<0?y-iy:iy+1-y)*ay;
 for(let i=0;i<36;i++){
  const side=ty<tx,d=side?ty:tx;
  if(side){iy+=sy;ty+=ay}else{ix+=sx;tx+=ax}
  if(d>=distance)return true;
  const rayZ=startZ+(endZ-startZ)*d/distance;
  if(grid[iy]?.[ix]!==0||rayZ<=heights[iy][ix])return false;
 }
 return false;
}
const portraits = new Image();
const atlas = [];
const floating = new Set([3,6,9]);
const wideGait = new Set([0,5,7]);
function sprite(id,pose,frame){
 const c=document.createElement('canvas');c.width=c.height=128;
 const g=c.getContext('2d');
 g.imageSmoothingEnabled=false;
 const cycle=frame/12*Math.PI*2;
 const progress=frame/11;
 const walking=pose==='walk', attacking=pose==='attack', dying=pose==='death';
 const recoil=attacking?Math.sin(progress*Math.PI)**2:0;
 const swing=Math.sin(cycle);
 const stride=walking?swing*(wideGait.has(id)?5:3):0;
 const hover=floating.has(id)?Math.sin(cycle)*2.6:0;
 const bob=walking?-Math.abs(swing)*2.4:Math.sin(cycle)*.9;
 const sx=id%5*112,sy=Math.floor(id/5)*112;
 const side=id%2===0?1:-1;
 const projectedSize=dying?1-.76*progress:1+recoil*.075;
 g.translate(64,120+hover+bob);
 if(dying){
  g.translate(side*progress*12,0);
  g.rotate(side*progress*.21);
 }
 g.scale(dying?1+progress*.13:1+recoil*.06,projectedSize);
 for(let row=0;row<112;row++){
  const t=row/111;
  const body=Math.sin(t*Math.PI);
  const movement=stride*(t<.6?body*.4:-(t-.6)*1.7);
  const lean=(1-t)*recoil*(id===2?12:5)*side;
  const flex=wideGait.has(id)?Math.sin(cycle+t*8)*Math.max(0,t-.49)*4:0;
  const x=-56+Math.round(movement+lean+flex);
  if(walking&&!floating.has(id)&&t>.65){
   const step=Math.round(swing*(t-.65)*9);
   const nextStep=Math.round(swing*((row+1)/111-.65)*9);
   if(1+nextStep-step>0)g.drawImage(portraits,sx,sy+row,56,1,x,-112+row+step,56,1+nextStep-step);
   if(1-nextStep+step>0)g.drawImage(portraits,sx+56,sy+row,56,1,x+56,-112+row-step,56,1-nextStep+step);
  }else{
   g.drawImage(portraits,sx,sy+row,112,1,x,-112+row,112,1);
  }
 }
 if(recoil>.55){
  g.globalCompositeOperation='source-atop';
  g.fillStyle='rgba(255,154,92,'+recoil*.22+')';
  g.fillRect(-64,-110,128,110);
 }
 return c;
}
function buildEnemyFrames(){
 const poses=['idle','walk','attack','death'];
 for(let id=0;id<types.length;id++){
  atlas[id]=Object.fromEntries(poses.map(pose=>[pose,Array.from({length:12},(_,frame)=>sprite(id,pose,frame))]));
 }
}

function initAudio(){
 if(!audio){
  audio=new AudioContext();music=audio.createGain();fx=audio.createGain();
  music.gain.value=muted?0:.34;fx.gain.value=.28;music.connect(audio.destination);fx.connect(audio.destination);
 }
 audio.resume(); nextBeat=audio.currentTime;
}
function tone(freq,duration,volume,wave,when,out,end=freq){
 const o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();
 filter.type='lowpass';filter.frequency.value=wave==='sawtooth'?1200:2300;
 o.type=wave;o.frequency.setValueAtTime(freq,when);o.frequency.exponentialRampToValueAtTime(end,when+duration);
 g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(volume,when+.009);g.gain.exponentialRampToValueAtTime(.0001,when+duration);
 o.connect(filter);filter.connect(g);g.connect(out);o.start(when);o.stop(when+duration+.01);
}
const riffs=[
 [0,0,3,0,6,0,5,3,0,0,10,0,6,5,3,1],
 [0,7,0,1,0,8,5,3,0,0,7,10,3,1,6,5],
 [0,0,0,6,1,0,8,6,0,12,0,7,6,3,1,0]
];
function score(){
 if(!audio)return;
 if(nextBeat<audio.currentTime-.15)nextBeat=audio.currentTime;
 while(nextBeat<audio.currentTime+.12){
  const i=step%16, root=[41.2,46.25,36.71][n], pitch=root*2**(riffs[n][i]/12);
  tone(pitch,.14,.25,'triangle',nextBeat,music);
  if(i!==7&&i!==15){
   tone(pitch*2,.115,.10,'sawtooth',nextBeat,music);
   tone(pitch*3,.115,.06,'sawtooth',nextBeat,music);
  }
  if(i%4===0||i===11)tone(105,.15,.5,'sine',nextBeat,music,36);
  if(i%8===4)tone(193,.095,.22,'square',nextBeat,music,58);
  if(i%2===0)tone(713,.026,.055,'square',nextBeat,music,269);
  if(i===0||i===10)tone(pitch*8,.35,.055,'triangle',nextBeat,music);
  nextBeat+=60/[128,144,156][n]/4;step++;
 }
}
function fire(){

 if(p.ammo<gun.cost){weapon=0;gun=guns[0]}
 p.ammo-=gun.cost;heat=gun.rate;flash=.105;
 if(audio)tone([188,116,77][weapon],.18,.7,'sawtooth',audio.currentTime,fx,29);
 const targets=foes.filter(e=>{
  const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||.001;
  return e.hp>0&&Math.abs(angle(Math.atan2(dy,dx)-p.a))<Math.atan2(.30,d)+gun.spread&&ray(p.x,p.y,dx/d,dy/d,p.z+.5,floor(e.x,e.y)+.52,d);
 }).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
 targets.slice(0,weapon===1?3:1).forEach((e,i)=>{e.hp-=gun.damage/(i+1)*(e.id===8&&!e.wind?.55:1);e.hit=.17});

   const speed=([2.4,1.2,2,2.1,1, .87,2.1,1,1.3,1.1][e.id]+(kind==='charger'&&see?1:0))*dt;
   const steer=kind==='strafer'?Math.sin(time*3):0;
   const ox=e.x,oy=e.y;move(e,(dx-dy*steer)/d*speed,(dy+dx*steer)/d*speed,.21);
   if(Math.hypot(e.x-ox,e.y-oy)<speed*.3)move(e,-dy/d*speed,dx/d*speed,.21);
  }
 }
 for(const s of shots){
  s.ttl-=dt;s.x+=Math.cos(s.a)*dt*s.speed;s.y+=Math.sin(s.a)*dt*s.speed;s.altitude+=s.slope*dt*s.speed;
  if(wall(s.x,s.y)||floor(s.x,s.y)>=s.altitude||s.altitude>=ceiling)s.ttl=0;
  if(s.ttl>0&&Math.hypot(p.x-s.x,p.y-s.y)<.28&&Math.abs(p.z+.44-s.altitude)<.50){damage(12);s.ttl=0}
 }
 shots=shots.filter(s=>s.ttl>0);
 const clear=foes.every(e=>e.hp<=0);
 items=items.filter(([x,y,kind])=>{
  if(Math.hypot(p.x-x,p.y-y)>.55)return true;
  if(kind==='hp'){if(p.hp===100)return true;p.hp=Math.min(100,p.hp+35)}
  if(kind==='ammo')p.ammo+=12;
  return kind==='exit';
 });
 if(p.hp<=0)end(false);
 else if(clear&&Math.hypot(p.x-15.5,p.y-15.5)<.55){if(n===2)end(true);else level(n+1)}
}
const depth=new Float32Array(W*H);
const frameBuffer=ctx.createImageData(W,H);
const pixels=new Uint32Array(frameBuffer.data.buffer);
const palettes=[
 [[116,63,48],[59,47,51],[43,26,34],[255,130,64]],
 [[49,93,98],[33,58,67],[26,42,53],[100,238,216]],
 [[103,46,77],[60,36,57],[46,25,41],[247,93,136]]
];
const ceiling=2.95, horizon=H/2, focal=225;
function shade(rgb,light){
 const r=Math.min(255,rgb[0]*light)|0,g=Math.min(255,rgb[1]*light)|0,b=Math.min(255,rgb[2]*light)|0;
 return (255<<24)|(b<<16)|(g<<8)|r;
}
function world(ca,sa,plane,eye){
 const [wallInk,floorInk,roofInk,lamp]=palettes[n];
 depth.fill(Infinity);
 pixels.fill(shade(roofInk,.24));
 for(let x=0;x<W;x++){
  const u=(2*x/W-1)*plane,dx=ca-sa*u,dy=sa+ca*u;
  let ix=Math.floor(p.x),iy=Math.floor(p.y),near=.004;
  const ax=Math.abs(1/dx),ay=Math.abs(1/dy),sx=Math.sign(dx),sy=Math.sign(dy);
  let tx=sx===0?Infinity:(sx<0?p.x-ix:ix+1-p.x)*ax;
  let ty=sy===0?Infinity:(sy<0?p.y-iy:iy+1-p.y)*ay;
  for(let cell=0;cell<36;cell++){
   const side=ty<tx,d=Math.max(.004,Math.min(tx,ty));
   const z=heights[iy][ix];
   const face=(horizon+(eye-z)*focal/d);
   const roof=horizon+(eye-ceiling)*focal/d;
   const top=horizon+(eye-z)*focal/near;
   const span=(from,to,planeZ,ink,isRoof)=>{
    const start=Math.max(0,Math.ceil(from)),end=Math.min(H,Math.ceil(to));
    for(let y=start;y<end;y++){
     const dist=(eye-planeZ)*focal/(y-horizon);
     const index=y*W+x;
     if(dist<=0||dist>=depth[index])continue;
     const wx=p.x+dx*dist,wy=p.y+dy*dist;
     const j=Math.floor(wx*16),k=Math.floor(wy*16);
     const seam=(j&15)===0||(k&15)===0;
     const grain=((j*13^k*31)&7)*.024;
     let light=(1.15+grain-(seam?.36:0))/(1+dist*.14);
     if(isRoof&&(j&63)>6&&(j&63)<10&&(k&63)<41)pixels[index]=shade(lamp,light*1.4);
     else pixels[index]=shade(ink,light);
     depth[index]=dist;
    }
   };
   span(Math.min(face,top),Math.max(face,top),z,floorInk,false);
   span(horizon+(eye-ceiling)*focal/near,roof,ceiling,roofInk,true);
   if(side){iy+=sy;ty+=ay}else{ix+=sx;tx+=ax}
   const solid=grid[iy]?.[ix]!==0,next=heights[iy]?.[ix]??z;
   if(solid||next!==z){
    const edge=side?p.x+dx*d:p.y+dy*d;
    const stripe=Math.floor((edge-Math.floor(edge))*64);
    const high=solid?ceiling:Math.max(z,next),low=solid?z:Math.min(z,next);
    const start=Math.max(0,Math.ceil(horizon+(eye-high)*focal/d));
    const end=Math.min(H,Math.ceil(horizon+(eye-low)*focal/d));
    for(let y=start;y<end;y++){
     const index=y*W+x;
     if(d>=depth[index])continue;
     const altitude=eye-(y-horizon)*d/focal;
     const row=Math.floor((altitude-low)*36),grain=((row*31^stripe*17)&7)*.025;
     const metal=(row%24<2||stripe<2||stripe>61)?.59:1;
     const rib=stripe%16<3?.79:1;
     const luminous=solid&&row%38===30&&stripe>8&&stripe<54;
     const hazard=!solid&&((stripe+row*2)&15)>8;
     const illumination=(1.12+grain)/(1+d*.116)*(side?.79:1);
     pixels[index]=shade(luminous||hazard?lamp:wallInk,illumination*(luminous?1.65:hazard?.58:metal*rib));
     depth[index]=d;
    }
   }
   if(solid)break;
   near=d;
  }
 }
 ctx.putImageData(frameBuffer,0,0);
}
function draw(){
 const ca=Math.cos(p.a),sa=Math.sin(p.a),plane=.69;
 const eye=p.z+.5+Math.sin(elapsed*2)*.018;
 world(ca,sa,plane,eye);
 const scene=[];
 for(const e of foes){
  if(!atlas[e.id])continue;
  const pose=e.hp<=0?'death':e.wind>0?'attack':e.walk?'walk':'idle';
  const frame=pose==='death'?Math.min(11,Math.floor(e.dead*21)):pose==='attack'?Math.min(11,Math.floor((.32-e.wind)*37)):Math.floor((time*(e.walk?22:11)+e.phase*12)%12);
  scene.push({x:e.x,y:e.y,art:atlas[e.id][pose][frame],size:e.id===9?1.48:1,hit:e.hit>0});
 }
 for(const s of shots)scene.push({...s,size:.14,offset:.50});
 for(const [x,y,kind] of items)scene.push({x,y,size:kind==='exit'?.65:.21,color:kind==='hp'?'#8cf0a2':kind==='ammo'?'#ffce75':foes.every(e=>e.hp<=0)?'#69fce0':'#bd5453',offset:kind==='exit'?.19:.09});
 for(const o of scene){const dx=o.x-p.x,dy=o.y-p.y;o.z=dx*ca+dy*sa;o.l=-dx*sa+dy*ca}
 scene.sort((a,b)=>b.z-a.z);
 for(const o of scene){
  if(o.z<.14)continue;
  const w=Math.floor(focal/o.z*o.size);
  const left=Math.floor(W/2+W/2*o.l/(o.z*plane)-w/2);
  const altitude=o.altitude??floor(o.x,o.y)+(o.offset||0);
  const top=Math.floor(horizon+(eye-altitude)*focal/o.z-w);
  if(w<1)continue;
  if(o.hit)ctx.filter='brightness(1.8)';
  for(let x=Math.max(left,0);x<Math.min(W,left+w);x++){
   const start=Math.max(0,top),end=Math.min(H,top+w);
   let y=start;
   while(y<end){
    while(y<end&&o.z>=depth[y*W+x])y++;
    const begin=y;
    while(y<end&&o.z<depth[y*W+x])y++;
    if(y===begin)continue;
    if(o.art){
     const size=o.art.width,sx=Math.min(size-1,Math.floor((x-left)*size/w));
     ctx.drawImage(o.art,sx,(begin-top)*size/w,1,(y-begin)*size/w,x,begin,1,y-begin);
    }else{
     const radius=Math.abs(x-left-w/2)/(w/2);
     const inset=w*.23*radius;
     const from=Math.max(begin,top+inset),to=Math.min(y,top+w-inset);
     if(from<to){ctx.fillStyle=o.color;ctx.fillRect(x,from,1,to-from)}
    }
   }
  }
  ctx.filter='none';
 }
 const gy=H-70+Math.sin(elapsed)*3+Math.max(0,flash)*210,gx=W/2+Math.cos(elapsed/2)*4;
 const profile=(color,points)=>{
  ctx.fillStyle=color;ctx.beginPath();
  points.forEach(([x,y],i)=>i?ctx.lineTo(gx+x,gy+y):ctx.moveTo(gx+x,gy+y));
  ctx.closePath();ctx.fill();
 };
 const wide=[25,41,34][weapon];
 profile('#20131f',[[-wide-7,30],[-wide-1,15],[-wide,4],[-16,-6],[17,-6],[wide,4],[wide+6,30],[53,77],[-53,77]]);
 profile('#675464',[[-wide,12],[-17,-3],[17,-3],[wide,12],[wide-4,46],[-wide+4,46]]);
 profile('#9b8580',[[-wide,12],[-17,-3],[17,-3],[wide,12],[26,18],[-26,18]]);
 profile('#302632',[[-26,18],[26,18],[32,45],[27,64],[-31,64],[-33,43]]);
 const color=guns[weapon].color;
 for(let i=0;i<weapon+2;i++){
  const x=(i-(weapon+1)/2)*13;
  ctx.fillStyle='#1d1625';ctx.fillRect(gx+x-5,gy+4,10,30);
  ctx.fillStyle=color;ctx.fillRect(gx+x-3,gy+6,6,24);
  ctx.fillStyle='#fff5db';ctx.fillRect(gx+x-2,gy+8,2,12);
 }
 profile('#4d3843',[[-50,62],[-37,37],[-28,40],[-30,60],[-12,78],[-51,78]]);
 profile('#76545a',[[50,62],[35,38],[28,42],[31,58],[14,78],[52,78]]);
 if(flash>0){
  ctx.globalAlpha=Math.min(1,flash*14);
  profile(color,[[-24,9],[-45,-20],[-15,-13],[-9,-45],[7,-25],[26,-50],[19,-11],[48,-22],[24,10]]);
  profile('#fffae0',[[-11,4],[-18,-14],[-4,-9],[0,-28],[7,-12],[22,-14],[12,4]]);
  ctx.globalAlpha=1;
 }
 if(hurt>0){ctx.fillStyle='rgba(255,36,40,'+hurt*.7+')';ctx.fillRect(0,0,W,H)}
 ctx.fillStyle='#fff0d0';ctx.fillRect(W/2-1,H/2-1,2,2);
 ctx.fillStyle='#100b17';ctx.fillRect(0,H-28,W,28);
 ctx.font='bold 11px monospace';ctx.fillStyle='#ff8b61';ctx.fillText('VIDA '+p.hp,10,H-10);
 ctx.fillStyle='#fff0d0';ctx.fillText(guns[weapon].name+' · '+p.ammo,89,H-10);
 ctx.fillStyle='#9ee9dd';ctx.fillText((n+1)+'/3  '+levels[n][0],289,H-10);
 const remaining=foes.filter(e=>e.hp>0).length;
 ctx.fillStyle='#100b17bb';ctx.fillRect(8,8,154,21);
 ctx.fillStyle='#fff0d0';ctx.fillText(remaining?'CONTACTES  '+remaining:'SORTIDA DESBLOQUEJADA',14,22);
}
function end(win){
 state='end';document.body.classList.remove('playing');document.exitPointerLock?.();
 $('intro').textContent=win?'El cor s’ha aturat. La foneria torna a ser vostra.':'La foneria t’ha engolit. Pots tornar a provar el nivell.';
 $('start').textContent=win?'Torna a la foneria':'Reintenta el nivell';
 $('menu').hidden=false;
 $('start').dataset.level=win?0:n;
 keys.clear();
}
$('start').onclick=()=>{
 if(state!=='pause')level(Number($('start').dataset.level||0));
 state='playing';$('menu').hidden=true;document.body.classList.add('playing');initAudio();
 if(matchMedia('(pointer:fine)').matches)screen.requestPointerLock?.()?.catch?.(()=>{});
};
$('mute').onclick=()=>{muted=!muted;if(music)music.gain.value=muted?0:.34;$('mute').textContent=muted?'♫ ×':'♫'};
$('swap').onclick=()=>{weapon=(weapon+1)%(n+1)};
function pause(){
 if(state!=='playing')return;
 state='pause';document.body.classList.remove('playing');keys.clear();
 $('intro').textContent='WASD per moure’t, ratolí o fletxes per girar, clic o espai per disparar, 1–3 per canviar d’arma.';
 $('start').textContent='Continua';$('menu').hidden=false;
}
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement)pause()});
window.addEventListener('blur',pause);
window.addEventListener('keydown',e=>{
 if(state!=='playing')return;
 const k=e.key.toLowerCase();keys.add(k);
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 if(/^[123]$/.test(k)&&Number(k)<=n+1)weapon=Number(k)-1;
 if(k==='escape')pause();
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
let drag=null;
screen.addEventListener('pointerdown',e=>{if(state!=='playing')return;if(e.pointerType==='mouse')fire();else{drag=e.clientX;screen.setPointerCapture(e.pointerId)}});
screen.addEventListener('pointermove',e=>{if(state==='playing'&&drag!==null){p.a+=(e.clientX-drag)*.012;drag=e.clientX}});
for(const ev of ['pointerup','pointercancel'])screen.addEventListener(ev,()=>{drag=null});
document.addEventListener('mousemove',e=>{if(state==='playing'&&document.pointerLockElement===screen)p.a+=e.movementX*.003});
document.querySelectorAll('[data-key]').forEach(b=>{
 b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};
 b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key);
});
prepareEnemies();
level(0);let last=0;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='playing'){time+=dt;update(dt);score()}
 draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
